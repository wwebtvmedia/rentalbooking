services:
  mongo:
    image: docker.io/library/mongo:4.4.18
    container_name: mongo
    restart: always
    # Root creds come straight from .env (MONGO_INITDB_ROOT_USERNAME / _PASSWORD).
    # We use env_file rather than `environment: ${VAR}` because podman-compose does NOT
    # reliably interpolate ${VAR} in the environment list (it passed the literal
    # "${MONGO_ROOT_USERNAME:-}" through, creating a garbage root user). When those two
    # keys are present on a *fresh* data dir, the official image creates the root user and
    # enables auth; absent/empty -> no auth. setup-env.sh writes them. For an existing data
    # dir, see the migration in USER_MANUAL §13.
    env_file: .env
    volumes:
      - ${MONGO_DATA_DIR:-./data/mongo}:/data/db:z
    # Do not expose MongoDB on the host in production. Backend reaches it over the internal compose network.

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: backend
    restart: always
    environment:
      # SMTP is configured via .env file (SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASS)
      - MAIL_FROM=${MAIL_FROM:-concierge@bestflats.vip}
    env_file: .env
    ports:
      - "4000:4000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-bestflats.vip}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-https://www.instagram.com/}
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mcp-client:
    build:
      context: ./mcp-client
      dockerfile: Containerfile
    container_name: mcp-client
    environment:
      - BACKEND_URL=http://backend:4000
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  mongo_data:
